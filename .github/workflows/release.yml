# release.yml -- explicit stable release promotion (GPSolo/meteor-stashhunting-addon).
# -----------------------------------------------------------------------------
# Manual (workflow_dispatch). Builds the chosen VERSION branch and publishes a
# STABLE (Latest) release tagged v<mod_version> -- the explicit "we're ready"
# step after pre-release testing. The mod_version comes from that branch's
# gradle.properties (bump it first, before dispatching, to start the next
# release cycle).
# -----------------------------------------------------------------------------
name: Publish Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Version branch to release (mod_version read from its gradle.properties)'
        required: false
        default: '26.2'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.branch || '26.2' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ startsWith(inputs.branch || '26.2', '26.') && '25' || '21' }}

      - name: Build
        run: ./gradlew build

      - name: Version + tag
        run: |
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          SHORT="$(git rev-parse --short HEAD)"
          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_ENV"
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
          echo "TAG=v${MOD_VERSION}" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JARS="$(ls build/libs/*.jar 2>/dev/null | grep -v -- '-sources' || true)"
          [ -n "$JARS" ] || JARS="build/libs/*.jar"
          NOTES="$(printf '%s\n' \
            "Stable release." \
            "" \
            "- Branch: ${{ inputs.branch || '26.2' }}" \
            "- Commit: ${HEAD_SHA}" \
            "- mod_version: ${MOD_VERSION}" \
            "" \
            "Promoted via the Publish Release workflow after pre-release testing.")"
          # shellcheck disable=SC2086
          gh release create "${TAG}" ${JARS} \
            --repo "$GITHUB_REPOSITORY" \
            --title "jefff-mod ${MOD_VERSION}" \
            --notes "$NOTES" \
            --target "$HEAD_SHA"