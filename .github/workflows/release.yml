# One shared stable release per addon version, with an asset for each MC branch.
name: Publish Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Minecraft version branch to build and attach to the shared stable release'
        required: false
        default: '26.2'
      version:
        description: 'Optional mod_version override (e.g. 0.16.8-26.3). Release tag is the addon version only (0.16.8).'
        required: false

permissions:
  contents: write

concurrency:
  group: stable-release-${{ inputs.branch || '26.2' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: ${{ inputs.branch || '26.2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Also fetch workflow tooling: older MC branches need not carry it.
          fetch-depth: 0
          ref: ${{ inputs.branch || '26.2' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ startsWith(inputs.branch || '26.2', '26.') && '25' || '21' }}

      - name: Apply version override
        if: inputs.version != ''
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          [[ "$VERSION_OVERRIDE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?-(1\.21\.[0-9]+|26\.[0-9]+(\.[0-9]+)?)$ ]] || {
            echo 'Invalid mod_version override' >&2; exit 1;
          }
          sed -i "s/^mod_version=.*/mod_version=${VERSION_OVERRIDE}/" gradle.properties

      - name: Build
        run: ./gradlew build

      - name: Test and install release tooling
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git archive "$WORKFLOW_SHA" .github/scripts/publish-stable.sh .github/scripts/test_publish_stable.py | tar -x -C "$RUNNER_TEMP"
          python3 -m unittest discover -s "$RUNNER_TEMP/.github/scripts" -p 'test_publish_stable.py'

      - name: Publish asset to shared stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$RUNNER_TEMP/.github/scripts/publish-stable.sh"
