# sync-qol.yml -- QoL feature-set synchronizer (GPSolo/meteor-stashhunting-addon).
# -----------------------------------------------------------------------------
# Ports the QoL feature set (qol-source.txt -- 7 files, canonical on the 26.2
# branch) into every target version branch (1.21.1/1.21.4/1.21.5/1.21.8/
# 1.21.10/1.21.11/26.1.2) using each target's own pinned loom migrateMappings
# (see .github/scripts/sync-qol.sh for the pipeline):
#
#   sync/qol-<source>-to-<target>  (never touches the target branch)
#        -> copy 7 manifest files from source
#        -> loom migrateMappings (temporary mojmap mappings on the target, same
#           minecraft version) + residual fixups
#        -> manifest registration (module + mixins) -- idempotent
#        -> ./gradlew build gate  (nothing ships without a green build)
#        -> dry | push | pr
#
# DELIVERY:
#   dry (default in script) -> commit on the sync branch, no push.
#   push                    -> push the sync branch.
#   pr                      -> push + open/refresh the PR (base: target).
# The workflow default is `pr` so a dispatch produces reviewable PRs.
#
# matrix-prep: GitHub's expression language has NO string `replace` function,
# so the comma-separated `version` input is split into a JSON array in a tiny
# bash job (the standard GH pattern) and consumed via fromJSON in the matrix.
# -----------------------------------------------------------------------------
name: sync-qol

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version branch(es), comma-separated (no spaces), e.g. 1.21.1,1.21.4,1.21.8'
        required: true
        default: '1.21.1,1.21.4,1.21.5,1.21.8,1.21.10,1.21.11,26.1.2'
      source_branch:
        description: 'QoL source branch (manifest files are ported from here)'
        required: false
        default: '26.2'
      source_ref:
        description: 'Pin source to an exact commit (empty = live origin/<source_branch> HEAD)'
        required: false
        default: ''
      qol_delivery:
        description: 'dry | push | pr'
        required: false
        default: 'pr'
      loom:
        description: 'loom version override (empty = pin from the target branch)'
        required: false
        default: ''

concurrency:
  group: sync-qol
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.split.outputs.targets }}
    steps:
      - id: split
        run: |
          V="${{ inputs.version }}"
          V="$(printf '%s' "$V" | tr -d ' ' | tr ',' '\n' | sed 's/.*/"&"/' | paste -sd, -)"
          echo "targets=[$V]" >> "$GITHUB_OUTPUT"

  sync:
    needs: matrix-prep
    runs-on: ubuntu-latest
    # Job-level group: `matrix` is not available at workflow level, so a
    # top-level group would collapse every target into one serial queue.
    # Per-target groups let independent targets run in parallel while two
    # dispatches of the same target queue safely behind each other.
    concurrency:
      group: sync-qol-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix-prep.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ startsWith(matrix.target, '26.') && '25' || '21' }}

      - name: Install tooling scripts (from the fork's default branch)
        run: |
          # The checkout ref is the VERSION branch (what loom migrates); it has
          # no .github/scripts. The tooling stack + manifest ride the default
          # branch (where this workflow lives). Extract from there so this step
          # is cwd-independent and works on every version branch.
          DEF="${{ github.event.repository.default_branch }}"
          git archive "origin/$DEF" .github/scripts | tar -x -C /tmp
          mv /tmp/.github/scripts /tmp/qol-scripts
          echo "QOL_SCRIPT_DIR=/tmp/qol-scripts" >> "$GITHUB_ENV"

      - name: Run QoL sync (${{ matrix.target }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QOL_DELIVERY: ${{ inputs.qol_delivery || 'pr' }}
        run: |
          chmod +x "$QOL_SCRIPT_DIR/sync-qol.sh"
          "$QOL_SCRIPT_DIR/sync-qol.sh" \
            --source-branch="${{ inputs.source_branch || '26.2' }}" \
            --source="${{ inputs.source_ref }}" \
            --target="${{ matrix.target }}" \
            --delivery="${{ inputs.qol_delivery || 'pr' }}" \
            --loom="${{ inputs.loom }}"

      - name: Upload sync diagnostics (${{ matrix.target }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-qol-${{ matrix.target }}
          path: |
            qol-tmp/migrate.log
            qol-tmp/gate.log
          if-no-files-found: ignore