# sync-base.yml -- base-branch src synchronizer (GPSolo/meteor-stashhunting-addon).
# -----------------------------------------------------------------------------
# Ports the ENTIRE src/main/java tree (canonical on the 26.2 branch; the sync
# scope is declared in base-source.txt) into every target version branch
# (1.21.1/1.21.4/1.21.5/1.21.8/1.21.10/1.21.11/26.1.2) using each target's own
# pinned loom migrateMappings (see .github/scripts/sync-base.sh for the
# pipeline):
#
#   sync/base-<source>-to-<target>  (never touches the target branch)
#        -> copy whole src/main/java tree from source
#        -> loom migrateMappings (temporary mojmap mappings on the target, same
#           minecraft version) + residual fixups; mojmap targets copy verbatim
#        -> metadata registration (mixins auto-discovered) -- idempotent
#        -> ./gradlew build gate
#        -> dry | push | pr
#
# DELIVERY:
#   dry (default in script) -> commit on the sync branch, no push.
#   push                    -> push the sync branch.
#   pr                      -> push + open/refresh the PR (base: target).
# The workflow default is `pr` so a dispatch produces reviewable PRs. Set
# `pr_title` to describe what is being added (e.g. "TripResumer echo fix");
# the PR body always lists the source commits being ported.
#
# DELIVER-ON-FAILURE: the run still opens/refreshes the PR even when a gate
# fails (the script delivers the migrated tree and exits non-zero; the PR is
# marked with the failing check + log excerpt so remaining port issues can be
# fixed on the sync branch). The run stays red for signal. Failure modes:
#   exit 3 -> fixups --verify failed (surviving mojmap token); build skipped
#   exit 5 -> ./gradlew build gate failed (migrated tree does not compile)
# Hard stops with NO PR (nothing reviewable to deliver): loom migrateMappings
# crashing (exit 3, no migrated output) and apply_manifest.py metadata
# failures (exit 4 -- rerun after fixing). All logs (migrate/gate/verify) are
# uploaded as artifacts on every run (ignore on missing).
#
# matrix-prep: GitHub's expression language has NO string `replace` function,
# so the comma-separated `version` input is split into a JSON array in a tiny
# bash job (the standard GH pattern) and consumed via fromJSON in the matrix.
# -----------------------------------------------------------------------------
name: sync-base

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version branch(es), comma-separated (no spaces), e.g. 1.21.1,1.21.4,1.21.8'
        required: true
        default: '1.21.1,1.21.4,1.21.5,1.21.8,1.21.10,1.21.11,26.1.2'
      source_branch:
        description: 'Base source branch -- the src/main/java tree is ported from here'
        required: false
        default: '26.2'
      source_ref:
        description: 'Pin source to an exact commit (empty = live origin/<source_branch> HEAD)'
        required: false
        default: ''
      delivery:
        description: 'dry | push | pr'
        required: false
        default: 'pr'
      loom:
        description: 'loom version override (empty = pin from the target branch)'
        required: false
        default: ''
      pr_title:
        description: 'PR title message describing what is being added (empty = default "Base sync: 26.2 -> <target>")'
        required: false
        default: ''

concurrency:
  group: sync-base
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.split.outputs.targets }}
    steps:
      - id: split
        run: |
          V="${{ inputs.version }}"
          V="$(printf '%s' "$V" | tr -d ' ' | tr ',' '\n' | sed 's/.*/\"&\"/' | paste -sd, -)"
          echo "targets=[$V]" >> "$GITHUB_OUTPUT"

  sync:
    needs: matrix-prep
    runs-on: ubuntu-latest
    # Job-level group: `matrix` is not available at workflow level, so a
    # top-level group would collapse every target into one serial queue.
    # Per-target groups let independent targets run in parallel while two
    # dispatches of the same target queue safely behind each other.
    concurrency:
      group: sync-base-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix-prep.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ startsWith(matrix.target, '26.') && '25' || '21' }}

      - name: Install tooling scripts (from the fork's default branch)
        run: |
          # The checkout ref is the VERSION branch (what loom migrates); it has
          # no .github/scripts. The tooling stack + manifest ride the default
          # branch (where this workflow lives). Extract from there so this step
          # is cwd-independent and works on every version branch.
          DEF="${{ github.event.repository.default_branch }}"
          git archive "origin/$DEF" .github/scripts | tar -x -C /tmp
          mv /tmp/.github/scripts /tmp/sync-scripts
          echo "SCRIPT_DIR=/tmp/sync-scripts" >> "$GITHUB_ENV"

      - name: Run base sync (${{ matrix.target }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_DELIVERY: ${{ inputs.delivery || 'pr' }}
        run: |
          chmod +x "$SCRIPT_DIR/sync-base.sh"
          set +e
          "$SCRIPT_DIR/sync-base.sh" \
            --source-branch="${{ inputs.source_branch || '26.2' }}" \
            --source="${{ inputs.source_ref }}" \
            --target="${{ matrix.target }}" \
            --delivery="${{ inputs.delivery || 'pr' }}" \
            --loom="${{ inputs.loom }}" \
            --pr-title="${{ inputs.pr_title }}"
          rc=$?
          set -e
          if [ "$rc" -eq 6 ]; then
            echo "[workflow] exit 6: ${{ matrix.target }} already in sync (normal no-op)"
            exit 0
          fi
          exit "$rc"

      - name: Upload sync diagnostics (${{ matrix.target }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-base-${{ matrix.target }}
          path: |
            sync-tmp/migrate.log
            sync-tmp/gate.log
            sync-tmp/verify.log
          if-no-files-found: ignore